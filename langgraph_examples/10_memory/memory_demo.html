<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>三层记忆对话演示台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* 布局概念：左侧对话流 + 右侧常驻记忆观察窗；记忆条目的置信度用横向刻度条 + 四档状态徽标编码 */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --line: #dfe3ea;
  --fg: #1b2030;
  --fg-soft: #5c6577;
  --fg-dim: #8b94a6;
  --accent: #3b5bdb;
  --accent-soft: #e8ecfd;
  --trusted: #1f8a5a;
  --active: #2f6fd0;
  --pending: #b5741a;
  --archived: #8a8f9c;
  --danger: #c0392b;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --sans: "Inter", -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --surface: #1a1e27;
    --surface-2: #232833;
    --line: #2e3441;
    --fg: #e6e9f0;
    --fg-soft: #a3abbd;
    --fg-dim: #737d91;
    --accent: #7d95ff;
    --accent-soft: #232a44;
    --trusted: #4fc48d;
    --active: #74a4f0;
    --pending: #e0a44e;
    --archived: #7b8494;
    --danger: #ef7f70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c;
  --surface: #1a1e27;
  --surface-2: #232833;
  --line: #2e3441;
  --fg: #e6e9f0;
  --fg-soft: #a3abbd;
  --fg-dim: #737d91;
  --accent: #7d95ff;
  --accent-soft: #232a44;
  --trusted: #4fc48d;
  --active: #74a4f0;
  --pending: #e0a44e;
  --archived: #7b8494;
  --danger: #ef7f70;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---- 顶栏 ---- */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 12px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--fg-dim); font-size: 12px; }

.field { display: flex; align-items: center; gap: 6px; }
.field label { color: var(--fg-soft); font-size: 12px; }
.field input {
  width: 130px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 8px;
  font-family: var(--mono);
  font-size: 12px;
}
.btn {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 12.5px;
  color: var(--fg-soft);
  transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn.primary:hover { filter: brightness(1.07); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-soft); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-dim); }
.dot.ok { background: var(--trusted); }
.dot.bad { background: var(--danger); }

/* ---- 主布局 ---- */
main {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  margin-top: 16px;
}
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.panel-head .spacer { margin-left: auto; }
.meta-line { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }

/* ---- 对话 ---- */
#log {
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: min(62vh, 620px);
  overflow-y: auto;
  min-width: 0;
}
.turn { display: flex; flex-direction: column; gap: 7px; }
.turn .who { font-size: 11px; color: var(--fg-dim); letter-spacing: .06em; text-transform: uppercase; }
.bubble {
  padding: 10px 13px;
  border-radius: 9px;
  background: var(--surface-2);
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 100%;
}
.turn.user .bubble { background: var(--accent-soft); align-self: flex-end; max-width: 88%; }
.turn.assistant .bubble { background: var(--surface-2); }
.streaming .bubble::after {
  content: "";
  display: inline-block;
  width: 6px; height: 14px;
  margin-left: 2px;
  vertical-align: -2px;
  background: var(--accent);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .streaming .bubble::after { animation: none; } }

.trace { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 11.5px;
  color: var(--fg-soft);
  font-family: var(--mono);
}
.chip.recall { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.created { border-color: var(--trusted); color: var(--trusted); }
.chip.confirmed { border-color: var(--active); color: var(--active); }
.chip.supplemented { border-color: var(--active); color: var(--active); }
.chip.contradicted { border-color: var(--pending); color: var(--pending); }
.chip.rejected { border-color: var(--danger); color: var(--danger); }

/* ---- 输入区 ---- */
.composer {
  border-top: 1px solid var(--line);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .chip { cursor: pointer; transition: border-color .15s, color .15s; }
.presets .chip:hover { border-color: var(--accent); color: var(--accent); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  height: 62px;
  line-height: 1.45;
}
.options { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12px; color: var(--fg-soft); }
.options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.options input[type="checkbox"] { accent-color: var(--accent); }

/* ---- 记忆面板 ---- */
.mem-list { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; max-height: min(46vh, 460px); overflow-y: auto; }
.mem-empty, .recall-empty { color: var(--fg-dim); font-size: 12.5px; padding: 4px 0; }
.mem {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.mem.archived { opacity: .62; border-style: dashed; }
.mem-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.key {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.mem-top .spacer { margin-left: auto; }
.tier {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 4px;
  padding: 1px 6px;
  border: 1px solid currentColor;
  white-space: nowrap;
}
.tier.trusted { color: var(--trusted); }
.tier.active { color: var(--active); }
.tier.pending_verify { color: var(--pending); }
.tier.archived { color: var(--archived); }
.mem-text { font-size: 13px; word-break: break-word; }
.meter { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
.bar { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 40px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--archived); }
.bar > i.trusted { background: var(--trusted); }
.bar > i.active { background: var(--active); }
.bar > i.pending_verify { background: var(--pending); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mem-extra { font-size: 11px; color: var(--fg-dim); font-family: var(--mono); word-break: break-word; }

/* ---- 召回预览 ---- */
.recall-box { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.recall-box h3, .weekly-box h3 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--fg-dim);
  margin: 0;
}
.recall-item { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.recall-item .key { max-width: none; }
.weekly-box { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.weekly-text { font-size: 12.5px; color: var(--fg-soft); white-space: pre-wrap; max-height: 120px; overflow-y: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 11px; color: var(--fg-dim); padding: 0 14px 12px; }
.legend .tier { font-size: 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  max-width: calc(100vw - 32px);
  z-index: 20;
}
.toast.show { opacity: 1; }
</style>

<header>
  <div class="brand">
    <h1>三层记忆对话演示台</h1>
    <span>短期窗口 · 中期周摘要 · 长期画像</span>
  </div>
  <div class="field">
    <label for="uid">用户</label>
    <input id="uid" value="stu_demo" spellcheck="false">
  </div>
  <button class="btn" id="newThread">新会话</button>
  <button class="btn" id="refreshMem">刷新记忆</button>
  <button class="btn" id="rebuild">重建索引</button>
  <div class="status"><span class="dot" id="dot"></span><span id="health">连接中…</span></div>
</header>

<main>
  <section class="panel" aria-label="对话">
    <div class="panel-head">
      <h2>对话</h2>
      <span class="spacer"></span>
      <span class="meta-line" id="threadLine">会话：未开始</span>
    </div>
    <div id="log"></div>
    <div class="composer">
      <div class="presets" id="presets"></div>
      <div class="input-row">
        <textarea id="msg" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn primary" id="send">发送</button>
      </div>
      <div class="options">
        <label><input type="checkbox" id="summaryDue"> 周摘要巩固 summary_due</label>
        <label><input type="checkbox" id="inject"> 注入记忆 pending_facts</label>
        <label><input type="checkbox" id="archived"> 显示归档条目</label>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="记忆观察窗">
    <div class="panel-head">
      <h2>学生画像（长期记忆）</h2>
      <span class="spacer"></span>
      <span class="meta-line" id="memCount">0 条</span>
    </div>
    <div class="legend">
      <span class="tier trusted">trusted ≥0.75</span>
      <span class="tier active">active ≥0.45</span>
      <span class="tier pending_verify">pending ≥0.25</span>
      <span class="tier archived">archived &lt;0.25</span>
    </div>
    <div class="mem-list" id="memList">
      <div class="mem-empty">发一条自我介绍，观察记忆如何写入并给出置信度。</div>
    </div>
    <div class="recall-box">
      <h3>本轮召回预览（meta 事件）</h3>
      <div id="recallList"><div class="recall-empty">尚未发生召回。</div></div>
    </div>
    <div class="weekly-box">
      <h3>本周学习摘要（中期记忆）</h3>
      <div class="weekly-text" id="weeklyText">暂无周摘要。勾选 summary_due 后发一条消息即可生成。</div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var API = "http://localhost:8000";
  var TIER_LABEL = { trusted: "trusted", active: "active", pending_verify: "pending", archived: "archived" };
  var ACTION_LABEL = {
    created: "新建记忆", confirmed: "确认", supplemented: "补充",
    contradicted: "冲突改写", rejected: "拒写", deleted: "删除", not_found: "未找到"
  };
  var state = { threadId: null, busy: false };

  var $ = function (id) { return document.getElementById(id); };

  var PRESETS = [
    { label: "自我介绍", text: "我叫李明，我的目标是考研，最头疼的是英语阅读" },
    { label: "跨会话认人", text: "你还记得我是谁吗？" },
    { label: "用进废退", text: "我的薄弱点是什么？再帮我列个复习计划" },
    { label: "纠正记忆", text: "我之前说错了，我其实不考研了，我准备考公" },
    { label: "措辞对比", text: "我大概想考个计算机方向的研究生" },
    { label: "周摘要", text: "这周学习总结一下", summary: true },
    { label: "注入两条事实", text: "帮我记一下", inject: true }
  ];

  var INJECT_FACTS = [
    { mem_key: "school", content: "李明就读于华北电力大学", source: "user_stated" },
    { mem_key: "weak_point:听力", content: "英语听力是薄弱项", source: "user_stated" }
  ];

  function toast(text) {
    var el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function pct(x) { return Math.round(Number(x || 0) * 100) + "%"; }

  function userId() { return ($("uid").value || "").trim() || "stu_demo"; }

  function scrollLog() {
    var log = $("log");
    log.scrollTop = log.scrollHeight;
  }

  // ---- 对话渲染 ----

  function addTurn(role, text) {
    var wrap = el("div", "turn " + role);
    wrap.appendChild(el("div", "who", role === "user" ? "学生" : "助手"));
    var bubble = el("div", "bubble", text);
    wrap.appendChild(bubble);
    var trace = el("div", "trace");
    wrap.appendChild(trace);
    $("log").appendChild(wrap);
    scrollLog();
    return { wrap: wrap, bubble: bubble, trace: trace };
  }

  function addChip(holder, cls, text) {
    holder.appendChild(el("span", "chip " + (cls || ""), text));
  }

  // ---- 记忆面板 ----

  function renderMemories(data) {
    var list = $("memList");
    list.innerHTML = "";
    var items = data.profile || [];
    $("memCount").textContent = items.length + " 条";
    if (!items.length) {
      list.appendChild(el("div", "mem-empty",
        "还没有长期记忆。发「我叫李明，我的目标是考研」，或勾选注入记忆做确定性演示。"));
    }
    items.forEach(function (m) {
      var card = el("div", "mem" + (m.status === "archived" ? " archived" : ""));
      var top = el("div", "mem-top");
      var keyText = m.mem_key + (m.original_key ? " ← " + m.original_key : "");
      top.appendChild(el("span", "key", keyText));
      top.appendChild(el("span", "spacer"));
      top.appendChild(el("span", "tier " + m.tier, TIER_LABEL[m.tier] || m.tier));
      card.appendChild(top);
      card.appendChild(el("div", "mem-text", m.content));

      var meter = el("div", "meter");
      var bar = el("div", "bar");
      var fill = el("i", m.tier);
      fill.style.width = Math.max(2, Math.min(100, Number(m.eff || 0) * 100)) + "%";
      bar.appendChild(fill);
      meter.appendChild(bar);
      meter.appendChild(el("span", "num", "eff " + pct(m.eff)));
      meter.appendChild(el("span", "num", "conf " + (Number(m.confidence || 0)).toFixed(2)));
      meter.appendChild(el("span", "num", "命中 " + (m.hit_count || 0)));
      card.appendChild(meter);

      card.appendChild(el("div", "mem-extra",
        "来源 " + (m.source || "-") +
        " · 半衰期 " + (m.halflife_days || "-") + " 天" +
        " · 版本 " + (m.revision || 1) +
        (m.supersedes && m.supersedes.length ? " · 取代 " + m.supersedes.join(",") : "")));
      list.appendChild(card);
    });

    var weekly = data.weekly || [];
    var wt = $("weeklyText");
    if (weekly.length) {
      wt.textContent = weekly.map(function (w) { return "[" + w.mem_key + "]\n" + w.content; }).join("\n\n");
    } else {
      wt.textContent = "暂无周摘要。勾选 summary_due 后发一条消息即可生成。";
    }
  }

  function renderRecall(recall) {
    var box = $("recallList");
    box.innerHTML = "";
    if (!recall || !recall.length) {
      box.appendChild(el("div", "recall-empty", "本轮未命中长期记忆（meta.recall 为空）。"));
      return;
    }
    recall.forEach(function (r) {
      var row = el("div", "recall-item");
      row.appendChild(el("span", "key", r.mem_key));
      row.appendChild(el("span", "tier " + r.tier, TIER_LABEL[r.tier] || r.tier));
      row.appendChild(el("span", "num", pct(r.eff)));
      var how = el("span", "meta-line", r.recall === "vector" ? "向量" : "关键词");
      row.appendChild(how);
      box.appendChild(row);
      box.appendChild(el("div", "recall-empty", r.content));
    });
  }

  function loadMemories() {
    return fetch(API + "/api/users/" + encodeURIComponent(userId()) +
                 "/memories?include_archived=" + ($("archived").checked ? "true" : "false"))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(renderMemories)
      .catch(function (e) { toast("读取记忆失败：" + e.message); });
  }

  function checkHealth() {
    var dot = $("dot");
    var label = $("health");
    fetch(API + "/health")
      .then(function (r) { return r.json(); })
      .then(function (h) {
        dot.className = "dot ok";
        label.textContent = "MySQL 在线 · Milvus " + (h.milvus ? "在线" : "降级");
        label.title = JSON.stringify(h);
      })
      .catch(function () {
        dot.className = "dot bad";
        label.textContent = "接口未连接";
      });
  }

  // ---- SSE 解析：按事件块切分，逐行取 data ----

  function parseBlock(block) {
    var event = "message";
    var dataLines = [];
    block.split(/\r?\n/).forEach(function (line) {
      if (line.indexOf("event:") === 0) event = line.slice(6).trim();
      else if (line.indexOf("data:") === 0) dataLines.push(line.slice(5).trim());
    });
    if (!dataLines.length) return null;
    try {
      return { event: event, data: JSON.parse(dataLines.join("\n")) };
    } catch (e) {
      return null;
    }
  }

  function send() {
    if (state.busy) return;
    var text = $("msg").value.trim();
    if (!text) return;

    var payload = {
      user_id: userId(),
      message: text,
      summary_due: $("summaryDue").checked
    };
    if (state.threadId) payload.thread_id = state.threadId;
    if ($("inject").checked) payload.pending_facts = INJECT_FACTS;

    $("msg").value = "";
    addTurn("user", text);
    var turn = addTurn("assistant", "");
    turn.wrap.classList.add("streaming");
    state.busy = true;
    $("send").disabled = true;

    var typed = "";
    var finished = false;

    fetch(API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (resp) {
        if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
        var reader = resp.body.getReader();
        var decoder = new TextDecoder("utf-8");
        var buffer = "";

        function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return;
            buffer += decoder.decode(chunk.value, { stream: true });
            var parts = buffer.split(/\n\n/);
            buffer = parts.pop();
            parts.forEach(handle);
            return pump();
          });
        }

        function handle(block) {
          var msg = parseBlock(block);
          if (!msg) return;
          var d = msg.data;

          if (msg.event === "meta") {
            state.threadId = d.thread_id;
            $("threadLine").textContent = "会话：" + d.thread_id.slice(0, 10) + "…";
            addChip(turn.trace, "recall", "召回 " + (d.recall ? d.recall.length : 0) + " 条 · 周摘要 " + d.weekly_count);
            renderRecall(d.recall);
          } else if (msg.event === "delta") {
            typed += d.content || "";
            turn.bubble.textContent = typed;
            scrollLog();
          } else if (msg.event === "final") {
            finished = true;
            turn.wrap.classList.remove("streaming");
            turn.bubble.textContent = d.answer || typed;
            if (d.thread_id) state.threadId = d.thread_id;
            (d.memory_log || []).forEach(function (log) {
              addChip(turn.trace, log.action,
                (log.tool === "consolidate" ? "巩固 · " : "") + log.mem_key + " · " +
                (ACTION_LABEL[log.action] || log.action));
            });
            if (d.weekly_written) addChip(turn.trace, "created", "周摘要已写回");
            renderRecall(d.recall);
            loadMemories();
          } else if (msg.event === "error") {
            turn.wrap.classList.remove("streaming");
            turn.bubble.textContent = "出错：" + d.message;
            addChip(turn.trace, "rejected", "error");
            finished = true;
          }
        }

        return pump().then(function () {
          if (buffer.trim()) handle(buffer);
          if (!finished) {
            turn.wrap.classList.remove("streaming");
            if (!typed) turn.bubble.textContent = "（流已结束，未收到内容）";
            loadMemories();
          }
        });
      })
      .catch(function (e) {
        turn.wrap.classList.remove("streaming");
        turn.bubble.textContent = "无法连接接口：" + e.message +
          "\n请确认 uvicorn 已在 8000 端口运行，且已重启加载最新代码。";
      })
      .then(function () {
        state.busy = false;
        $("send").disabled = false;
      });
  }

  // ---- 事件绑定 ----

  function resetThread() {
    state.threadId = null;
    $("threadLine").textContent = "会话：未开始";
    $("log").innerHTML = "";
    renderRecall([]);
    toast("已开启新会话，长期记忆仍保留");
  }

  function rebuildIndex() {
    var btn = $("rebuild");
    btn.disabled = true;
    fetch(API + "/api/admin/rebuild-index", { method: "POST" })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.body.detail || "重建失败");
        toast("索引重建完成：" + res.body.indexed + "/" + res.body.long_entries + " 条");
      })
      .catch(function (e) { toast("重建失败：" + e.message + "（旧进程可能未加载该接口）"); })
      .then(function () { btn.disabled = false; });
  }

  PRESETS.forEach(function (p) {
    var chip = el("button", "chip", p.label);
    chip.type = "button";
    chip.addEventListener("click", function () {
      $("msg").value = p.text;
      $("summaryDue").checked = !!p.summary;
      $("inject").checked = !!p.inject;
      $("msg").focus();
    });
    $("presets").appendChild(chip);
  });

  $("send").addEventListener("click", send);
  $("msg").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  $("newThread").addEventListener("click", resetThread);
  $("refreshMem").addEventListener("click", function () { loadMemories(); toast("已刷新记忆"); });
  $("rebuild").addEventListener("click", rebuildIndex);
  $("archived").addEventListener("change", loadMemories);
  $("uid").addEventListener("change", function () { loadMemories(); });

  checkHealth();
  loadMemories();
})();
</script>
